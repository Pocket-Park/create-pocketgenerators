name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Extract tag changelog
        id: changelog
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          BODY="$(git tag -l --format='%(contents)' "$TAG_NAME")"
          if [ -z "$BODY" ]; then
            BODY="Release ${TAG_NAME}"
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/!(*-sources|*-dev).jar
          name: Pocket Generators ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          changelog: ${{ steps.changelog.outputs.body }}
          loaders: neoforge
          game-versions: 1.21.1
          dependencies: |
            create required
            jei optional
