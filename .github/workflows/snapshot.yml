name: Snapshot

on:
  push:
    branches:
      - dev

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Exposed at job level so the CurseForge step can be skipped when the secret is not set yet
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Compute snapshot version
        id: version
        run: |
          BASE_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "version=${BASE_VERSION}-dev.${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Publish snapshot to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/!(*-sources|*-dev).jar
          name: Pocket Generators ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: beta
          changelog: ${{ github.event.head_commit.message }}
          loaders: neoforge
          game-versions: 1.21.1
          dependencies: |
            create required
            jei optional

      - name: Publish snapshot to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/!(*-sources|*-dev).jar
          name: Pocket Generators ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: beta
          changelog: ${{ github.event.head_commit.message }}
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            create(required){curseforge:328085}
            jei(optional){curseforge:238222}

      # Tag prefixed with "dev-" (not "v") so it never matches the release.yml trigger
      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pocket Generators ${{ steps.version.outputs.version }}
          body: ${{ github.event.head_commit.message }}
          files: build/libs/*.jar
          prerelease: true
