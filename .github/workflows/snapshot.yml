name: Snapshot

on:
  push:
    branches:
      - dev

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Compute snapshot version
        id: version
        run: |
          BASE_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "version=${BASE_VERSION}-dev.${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Publish snapshot to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/!(*-sources|*-dev).jar
          name: Pocket Generators ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: beta
          changelog: ${{ github.event.head_commit.message }}
          loaders: neoforge
          game-versions: 1.21.1
          dependencies: |
            create required
            jei optional
